name: Routing Check

# O roteamento dos alertas vem do alerts.json de cada serviço. Quando um deles muda, o snapshot daqui
# fica desatualizado: esta verificação diária falha e avisa, até alguém rodar `npm run routing:sync`.
on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  routing:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Check the routing snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/sync-routing.mjs --check
